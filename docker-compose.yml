services:

  app:
    build: .
    container_name: linkedin-app
    env_file:
      - .env
    environment:
      PORT: 3011
      NODE_ENV: production
    expose:
      - "3011"
    ports:
      - "3011:3011"
    restart: unless-stopped

    networks:
      - webnet

    # ── Security hardening ────────────────────────────────────────────────────
    # Prevent the container process from gaining new privileges via setuid/setgid
    security_opt:
      - no-new-privileges:true

    # Drop ALL Linux capabilities; add back only what is strictly needed.
    # The app binds to port 3011 (>1024) so NET_BIND_SERVICE is not needed.
    cap_drop:
      - ALL

    # ── /tmp as noexec tmpfs ─────────────────────────────────────────────────
    # Mounts /tmp as an in-memory filesystem with these security flags:
    #   noexec  - binaries in /tmp cannot be executed (direct XMRig countermeasure)
    #   nosuid  - setuid bits are ignored (prevents privilege escalation)
    #   nodev   - device files are ignored
    #   size=64m - caps DoS via /tmp flooding
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m

networks:
  webnet:
    external: true
